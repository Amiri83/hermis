  <text class="h" x="895" y="185">Hermes</text>
  <text class="t" x="895" y="220">Orchestrate</text>
  <text class="t" x="895" y="248">QA / verification</text>
  <text class="t" x="895" y="276">Git management</text>

  <rect class="card" x="1155" y="150" width="195" height="150" rx="18"/>
  <rect class="accent5" x="1155" y="150" width="195" height="8" rx="4"/>
  <text class="h" x="1185" y="200">Claude Code</text>
  <text class="t" x="1185" y="235">Main coding agent</text>
  <text class="t" x="1185" y="263">Implement changes</text>

