<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <style>
      .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d;stroke-width:2}.title{fill:#f0f6fc;font:700 28px system-ui,-apple-system,Segoe UI,sans-serif}.h{fill:#f0f6fc;font:700 22px system-ui,-apple-system,Segoe UI,sans-serif}.t{fill:#c9d1d9;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.small{fill:#8b949e;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.arrow{stroke:#8b949e;stroke-width:3;fill:none;marker-end:url(#a)}.accent1{fill:#1f6feb}.accent2{fill:#8957e5}.accent3{fill:#d29922}.accent4{fill:#238636}.accent5{fill:#da3633}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="620" rx="24"/>
  <text class="title" x="50" y="60">My 24/7 AI DevOps workflow</text>
  <text class="small" x="50" y="90">Claude shapes the task. Hermes manages the job. Claude Code does the coding.</text>

