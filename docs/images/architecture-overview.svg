  <text class="t" x="80" y="235">Idea / problem</text>
  <text class="t" x="80" y="263">Discuss requirements</text>

  <rect class="card" x="315" y="150" width="235" height="150" rx="18"/>
  <rect class="accent2" x="315" y="150" width="235" height="8" rx="4"/>
  <text class="h" x="345" y="200">Claude</text>
  <text class="t" x="345" y="235">Shape solution</text>
  <text class="t" x="345" y="263">Create Hermes prompt</text>

  <rect class="card" x="605" y="150" width="205" height="150" rx="18"/>
  <rect class="accent3" x="605" y="150" width="205" height="8" rx="4"/>
