  <path class="arrow" d="M550 225 H605"/>
  <path class="arrow" d="M810 225 H865"/>
  <path class="arrow" d="M1100 225 H1155"/>
  <path class="arrow" d="M1155 280 C1125 360 1065 360 1010 320"/>

